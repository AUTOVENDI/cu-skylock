[package]
name = "cu-skylock-tracker"
description = "Copper task that tracks one target through detections with a constant-velocity Kalman filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["copper", "robotics", "tracking", "kalman", "filter"]
categories = ["science::robotics", "computer-vision"]
publish = false

# Read by Copper's component catalog.
[package.metadata.copper]
kind = "task"
domains = ["algorithm/perception", "algorithm/estimation"]
environments = ["host"]

[dependencies]
cu29 = { workspace = true }
cu-skylock-payloads = { workspace = true }
skylock-timing = { workspace = true }
bincode = { workspace = true }

# cu29's logging macros intern their strings at build time.
[build-dependencies]
cu29-build = { workspace = true }
